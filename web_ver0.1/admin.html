<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주말해 - 통합 데이터 관리자 센터</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS (Shares styling with main app) -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <div class="app-container admin-container">
    
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <h1 class="app-title"><i class="fa-solid fa-database text-indigo"></i> 주말<span>해</span> <span>Admin</span></h1>
        <p class="app-subtitle">CSV 데이터베이스 관리자 패널</p>
      </div>
      <a href="index.html" class="action-btn header-back-btn">
        <i class="fa-solid fa-house"></i> 메인 화면
      </a>
    </header>

    <!-- Stats Grid -->
    <section class="admin-stats-grid">
      <div class="stat-box">
        <div class="stat-icon"><i class="fa-solid fa-location-dot"></i></div>
        <div class="stat-info">
          <span class="stat-val" id="admin-places-count">0</span>
          <span class="stat-lbl">총 등록 장소</span>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-icon"><i class="fa-solid fa-calendar-days"></i></div>
        <div class="stat-info">
          <span class="stat-val" id="admin-events-count">0</span>
          <span class="stat-lbl">연동된 행사</span>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-icon"><i class="fa-solid fa-tower-broadcast"></i></div>
        <div class="stat-info">
          <span class="stat-val" id="admin-metrics-count">0</span>
          <span class="stat-lbl">실시간 지표</span>
        </div>
      </div>
    </section>

    <!-- Database Table Navigation -->
    <div class="table-switcher">
      <button class="switcher-btn active" data-table="places">
        <i class="fa-solid fa-map-location-dot"></i> Places DB
      </button>
      <button class="switcher-btn" data-table="events">
        <i class="fa-solid fa-tags"></i> Events DB
      </button>
      <button class="switcher-btn" data-table="metrics">
        <i class="fa-solid fa-chart-line"></i> Metrics DB
      </button>
    </div>

    <!-- Toolbar: Search and Export -->
    <div class="table-toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="admin-search-input" placeholder="선택한 테이블 데이터 필터링...">
      </div>
    </div>

    <!-- Data Display Area -->
    <main class="table-responsive-container">
      <table class="data-table" id="admin-data-table">
        <thead>
          <tr id="table-headers">
            <th>데이터를 불러오는 중...</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td>잠시만 기다려주세요.</td>
          </tr>
        </tbody>
      </table>
    </main>

    <!-- Modal for viewing full description or JSON details -->
    <div class="modal" id="details-modal">
      <div class="modal-content">
        <h3 id="details-modal-title">상세 정보</h3>
        <p class="modal-desc" id="details-modal-desc"></p>
        <button class="close-btn" id="details-modal-close-btn">닫기</button>
      </div>
    </div>
    
  </div>

  <script src="admin.js"></script>
</body>
</html>
