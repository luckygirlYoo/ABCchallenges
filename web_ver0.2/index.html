<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>주말해 - AI 주말 맞춤형 여가 추천</title>
  <meta name="description" content="AI가 분석한 이번 주말 맞춤 여가 추천 서비스. 가족, 커플, 싱글별 테마 코스 제공.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-wrap">

  <!-- ── 상단 헤더 ── -->
  <header class="nh-header">
    <div class="nh-header__left">
      <div class="nh-logo">
        <span class="nh-logo__mark">🌿</span>
        <span class="nh-logo__text">주말<b>해</b></span>
      </div>
      <span class="nh-header__date" id="header-date"></span>
    </div>
    <div class="nh-header__right">
      <button class="icon-btn" id="search-toggle-btn" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
      <a href="admin.html" class="icon-btn" aria-label="관리자"><i class="fa-solid fa-database"></i></a>
    </div>
  </header>

  <!-- ── 일정 알림 티커 배너 ── -->
  <div class="alert-ticker" id="alert-ticker" role="marquee" aria-label="즐겨찾기 일정 알림">
    <div class="ticker-icon"><i class="fa-solid fa-bell"></i></div>
    <div class="ticker-track-wrap">
      <div class="ticker-track" id="ticker-track">
        <!-- JS가 채움 -->
        <span class="ticker-item">📅 즐겨찾기한 장소의 일정을 여기에서 확인하세요</span>
      </div>
    </div>
  </div>

  <!-- ── 검색창 (접힘/펼침) ── -->
  <div class="search-bar-wrap" id="search-bar-wrap" hidden>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="장소명, 키워드 검색..." autocomplete="off">
      <button id="search-clear-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!--           추천 화면 (기본 뷰)            -->
  <!-- ═══════════════════════════════════════ -->
  <div id="view-home">
    <!-- ── 주 세그먼트 탭 (가족 / 커플 / 싱글) ── -->
    <nav class="seg-tabs" role="tablist" aria-label="사용자 유형 선택">
      <button class="seg-tab active" data-seg="family" role="tab" aria-selected="true" id="tab-family">
        <i class="fa-solid fa-baby-carriage"></i> 아기랑 가족
      </button>
      <button class="seg-tab" data-seg="couple" role="tab" aria-selected="false" id="tab-couple">
        <i class="fa-solid fa-heart"></i> 데이트 커플
      </button>
      <button class="seg-tab" data-seg="single" role="tab" aria-selected="false" id="tab-single">
        <i class="fa-solid fa-headphones"></i> 싱글 매니아
      </button>
      <button class="seg-tab" data-seg="food" role="tab" aria-selected="false" id="tab-food">
        <i class="fa-solid fa-utensils"></i> 맛집
      </button>
    </nav>

    <!-- ── 하위 테마 칩 (가로 스크롤) ── -->
    <div class="theme-chips-wrap">
      <div class="theme-chips" id="theme-chips">
        <!-- JS가 동적으로 채움 -->
      </div>
    </div>

    <!-- ── 테마 배너 ── -->
    <div class="theme-banner" id="theme-banner">
      <div class="theme-banner__text">
        <p class="theme-banner__sub" id="banner-sub">아이와 함께</p>
        <h2 class="theme-banner__title" id="banner-title">여름 피서지</h2>
      </div>
      <div class="theme-banner__emoji" id="banner-emoji">🏖️</div>
    </div>

    <!-- ── 장소 리스트 ── -->
    <main class="place-list-wrap" id="place-list" role="main">
      <div class="loading-row">
        <div class="nh-spinner"></div>
        <span>추천 장소를 불러오는 중...</span>
      </div>
    </main>

    <!-- ── 페이지네이션 ── -->
    <div class="pagination-bar" id="pagination-bar" hidden>
      <button class="page-btn" id="page-prev"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="page-info" id="page-info">1 / 1</span>
      <button class="page-btn" id="page-next"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div><!-- /view-home -->

  <!-- ═══════════════════════════════════════ -->
  <!--          즐겨찾기 화면 (fav 뷰)          -->
  <!-- ═══════════════════════════════════════ -->
  <div id="view-fav" hidden>
    <!-- 즐겨찾기 헤더 -->
    <div class="fav-header">
      <div class="fav-header__left">
        <i class="fa-solid fa-star" style="color:#F9A825"></i>
        <span>내 즐겨찾기</span>
      </div>
      <button class="fav-share-btn" id="fav-share-btn" aria-label="즐겨찾기 리스트 공유">
        <i class="fa-solid fa-share-nodes"></i> 공유하기
      </button>
    </div>

    <!-- 즐겨찾기 일정 요약 카드 -->
    <div class="fav-schedule-card" id="fav-schedule-card">
      <!-- JS가 채움 -->
    </div>

    <!-- 즐겨찾기 장소 리스트 -->
    <main class="place-list-wrap" id="fav-list" role="main">
      <!-- JS가 채움 -->
    </main>
  </div><!-- /view-fav -->

  <!-- ── 하단 네비게이션 ── -->
  <footer class="bottom-nav">
    <button class="bnav-item active" id="bnav-home">
      <i class="fa-solid fa-compass"></i><span>추천</span>
    </button>
    <button class="bnav-item" id="bnav-fav">
      <i class="fa-solid fa-star"></i><span>즐겨찾기</span>
      <span class="bnav-fav-badge" id="bnav-fav-badge" hidden></span>
    </button>
    <button class="bnav-item" id="bnav-refresh">
      <i class="fa-solid fa-arrows-rotate"></i><span>갱신</span>
    </button>
    <a href="admin.html" class="bnav-item">
      <i class="fa-solid fa-database"></i><span>관리</span>
    </a>
  </footer>

  <!-- ── 장소 상세 Bottom Sheet ── -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="detail-sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-label="장소 상세 정보">
    <div class="sheet-handle"></div>
    <button class="sheet-close-btn" id="sheet-close-btn"><i class="fa-solid fa-xmark"></i></button>
    <div class="sheet-body" id="sheet-body"><!-- JS fills --></div>
  </div>

  <!-- ── 공유하기 바텀시트 ── -->
  <div class="sheet-overlay" id="share-overlay"></div>
  <div class="share-sheet" id="share-sheet" role="dialog" aria-modal="true" aria-label="공유하기">
    <div class="sheet-handle"></div>
    <button class="sheet-close-btn" id="share-close-btn"><i class="fa-solid fa-xmark"></i></button>
    <div class="share-sheet__body">
      <div class="share-sheet__title">
        <i class="fa-solid fa-share-nodes" style="color:var(--nh-green)"></i>
        내 즐겨찾기 공유하기
      </div>
      <p class="share-sheet__desc" id="share-desc">즐겨찾기한 장소 목록을 친구에게 공유해 보세요!</p>

      <!-- 앱 선택 그리드 -->
      <div class="share-apps-grid">
        <!-- 카카오톡 -->
        <button class="share-app-btn" id="share-kakao" aria-label="카카오톡으로 공유">
          <div class="share-app-icon kakao">
            <i class="fa-solid fa-comment"></i>
          </div>
          <span>카카오톡</span>
        </button>
        <!-- 올원뱅크 -->
        <button class="share-app-btn" id="share-allone" aria-label="올원뱅크로 공유">
          <div class="share-app-icon allone">
            <span class="allone-logo">ALL</span>
          </div>
          <span>올원뱅크</span>
        </button>
        <!-- 인스타그램 -->
        <button class="share-app-btn" id="share-instagram" aria-label="Instagram으로 공유">
          <div class="share-app-icon instagram">
            <i class="fa-brands fa-instagram"></i>
          </div>
          <span>Instagram</span>
        </button>
        <!-- 링크 복사 -->
        <button class="share-app-btn" id="share-copy" aria-label="링크 복사">
          <div class="share-app-icon copy">
            <i class="fa-solid fa-link"></i>
          </div>
          <span>링크 복사</span>
        </button>
      </div>

      <!-- 링크 복사 성공 토스트 -->
      <div class="copy-toast" id="copy-toast" hidden>
        <i class="fa-solid fa-circle-check"></i> 링크가 클립보드에 복사되었습니다!
      </div>

      <!-- 기기 네이티브 공유 (Web Share API) -->
      <button class="share-more-btn" id="share-more-btn">
        <i class="fa-solid fa-ellipsis"></i> 더 많은 앱으로 공유
      </button>
    </div>
  </div>

  <!-- ── 갱신 모달 ── -->
  <div class="nh-modal-overlay" id="refresh-modal-overlay">
    <div class="nh-modal">
      <h3><i class="fa-solid fa-arrows-rotate"></i> 실시간 데이터 수집 및 갱신</h3>
      <ul class="modal-stat-list">
        <li><span>총 등록 명소/장소</span><strong id="m-places">0개</strong></li>
        <li><span>실시간 등록 행사</span><strong id="m-events">0개</strong></li>
        <li><span>데이터 연동 상태</span><strong class="ok">✅ 정상 (실시간)</strong></li>
      </ul>
      <div id="collect-status-box" style="font-size:12px;color:var(--nh-text-sec);text-align:center;padding:4px 0;" hidden>
        <span id="collect-status-text">수집 진행 중...</span>
      </div>
      <button class="nh-btn" id="run-collect-btn" style="background:#0066CC;">
        <i class="fa-solid fa-rotate"></i> 실시간 데이터 수집 실행
      </button>
      <button class="nh-btn" id="refresh-modal-close" style="background:var(--nh-bg-sub);color:var(--nh-text-primary);border:1px solid var(--nh-border);">닫기</button>
    </div>
  </div>

</div><!-- /app-wrap -->
<script src="app.js"></script>
</body>
</html>
