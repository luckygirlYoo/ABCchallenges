name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site structure
        run: |
          mkdir -p _site/data
          # web 폴더 내용을 루트에 복사
          cp -r web/. _site/
          # data 폴더를 site/data에 복사 (CSV, JSON 정적 파일로 제공)
          cp data/*.csv _site/data/ 2>/dev/null || true
          cp data/*.json _site/data/ 2>/dev/null || true
          # app.js의 data 경로를 ../data/에서 ./data/로 수정
          sed -i "s|'../data/|'./data/|g" _site/app.js
          sed -i 's|"../data/|"./data/|g' _site/app.js
          sed -i "s|fetch('../data/|fetch('./data/|g" _site/app.js
          echo "✅ 빌드 완료!"
          ls -la _site/
          ls -la _site/data/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
